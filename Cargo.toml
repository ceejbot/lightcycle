[package]
name = "lightcycle"
version = "0.1.0"
edition = "2024"
authors = ["C J Silverio <ceejceej@gmail.com>"]
description = "A consistent hash ring using blake3."
readme = "README.md"
license = "Parity-7.0.0"
repository = "https://github.com/ceejbot/lightcycle"
homepage = "https://github.com/ceejbot/lightcycle"

[features]
default = ["hash-blake3"]
hash-blake3 = ["blake3"]
hash-xxhash = ["xxhash-rust"]
hash-blake2 = ["blake2", "typenum"]
hash-sha2 = ["sha2"]
hash-fnv = []

[dependencies]
blake3 = { version = "1.3.3", optional = true }
xxhash-rust = { version = "0.8", features = ["xxh3"], optional = true }
blake2 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
typenum = { version = "1.17", optional = true }
thiserror = "2.0.16"

[lints.rust]
unsafe_code = { level = "deny", priority = 1 }
future_incompatible = { level = "deny", priority = 2 }
trivial_casts = { level = "warn", priority = 3 }
rust_2018_idioms = { level = "warn", priority = 4 }

[lints.clippy]
unwrap_used = "deny"

[profile.release]
lto = true        # Enable full link-time optimization
codegen-units = 1 # Single codegen unit for better optimization
opt-level = 3     # Maximum optimization
strip = true      # Strip symbols for smaller binary
panic = "abort"   # Smaller binary, no unwinding

[dev-dependencies]
kolmogorov_smirnov = "1.1.0"
